url: https://michalaferber.github.io
baseurl: "/frequency-tone-generator"

theme: jekyll-theme-cayman

repository: MichalAFerber/frequency-tone-generator
show_downloads: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
